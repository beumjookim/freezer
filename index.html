<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>경기냉동</title>

    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#004085">

    <style>
        :root { --primary: #004085; --bg: #f4f7f6; --border: #ddd; }
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; background: var(--bg); padding-bottom: 140px; color: #333; }
        header { background: var(--primary); color: white; padding: 15px; font-weight: bold; text-align: center; font-size: 1.5rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); letter-spacing: 2px; }
        .view-container { display: none; padding: 15px; }
        .active-view { display: block; }
        .day-cell.selected { background: #004085 !important; color: white !important; border: 2px solid #ffc107 !important; }
        .day-cell.selected .badge { background: white; color: #004085; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; }
        .cal-btn { background: none; border: none; font-size: 1.2rem; padding: 5px 15px; cursor: pointer; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: white; padding: 10px; border-radius: 12px; }
        .day-cell { height: 65px; border: 1px solid #f0f0f0; border-radius: 8px; position: relative; display: flex; flex-direction: column; padding: 4px; font-size: 0.9rem; cursor: pointer; }
        .day-cell.today { border: 2px solid var(--primary); background: #eef6ff; }
        .badge { position: absolute; bottom: 3px; right: 3px; background: #dc3545; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; display: none; }
        .badge.show { display: block; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); cursor: pointer; }
        .total-box { background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: right; font-size: 1.3rem; font-weight: bold; color: #004085; margin-top: 10px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; margin-bottom: 5px; }
        footer { text-align: center; padding: 20px 10px; color: #888; font-size: 0.8rem; border-top: 1px solid #eee; margin-top: 30px; line-height: 1.6; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #eee; display: flex; padding: 8px 5px; z-index: 99; }
        .nav-btn { flex: 1; text-align: center; color: #999; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <header>경기냉동</header>

    <div id="viewCalendar" class="view-container active-view">
        <div class="cal-header">
            <button class="cal-btn" onclick="changeMonth(-1)">◀</button>
            <span id="currentMonthStr"></span>
            <button class="cal-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="cal-grid" id="calendarGrid"></div>
        <h3 style="margin:20px 0 10px; font-size:1rem; border-bottom:2px solid var(--primary); display:inline-block;">작업 목록</h3>
        <div id="dailyList"></div>
    </div>

    <div id="viewForm" class="view-container">
        <input type="hidden" id="editId">
        <label>📅 날짜</label><input type="date" id="inDate">
        <label>🏢 업체명</label><input type="text" id="inName">
        <label>📝 작업 내용</label><textarea id="inAction" rows="3"></textarea>
        
        <label>🔧 사용 부품 및 자재</label>
        <div style="background:#fff; padding:10px; border-radius:8px; border:1px solid #ddd;">
            <input type="text" id="partName" list="partSuggestions" placeholder="부품명">
            <datalist id="partSuggestions"></datalist>
            <div style="display:flex; gap:5px;">
                <input type="number" id="partBuyPrice" placeholder="구입가">
                <input type="number" id="partPrice" placeholder="판매가">
                <input type="number" id="partQty" placeholder="수량">
            </div>
            <button onclick="addPart()" style="width:100%; background:#6c757d; color:#fff; border:none; padding:10px; border-radius:5px; margin-top:5px;">+ 부품 추가</button>
        </div>
        <div id="addedPartsList" style="margin-top:10px;"></div>

        <label>💰 공임비</label><input type="number" id="inLabor" value="0" oninput="calcTotal()">
        <div class="total-box">합계: <span id="displayTotal">0</span>원</div>
        <button onclick="saveData()" style="width:100%; padding:15px; background:#004085; color:#fff; border:none; border-radius:10px; margin-top:20px; font-weight:bold;">저장 완료</button>
    </div>

    <footer>
        <b>경기냉동</b><br>
        대표: 송기천 | 전화: 010-5422-6705<br>
        주소: 경기도 고양시 일산서구 덕산로 312번길 15, 103호
    </footer>

    <div class="bottom-nav">
        <div class="nav-btn active" onclick="goTab('calendar')">📅<br>달력</div>
        <div class="nav-btn" onclick="openForm()">✏️<br>등록</div>
    </div>

    <script>
        const GOOGLE_SHEET_URL = "여기에_스크립트_URL을_넣으세요";
        const STORAGE_KEY = 'ggFreezerLogs';
        let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let curYear, curMonth, selDate;
        let tempParts = [];

        function getLocalDate() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now - offset).toISOString().split('T')[0];
        }

        window.onload = () => {
            const now = new Date();
            curYear = now.getFullYear(); curMonth = now.getMonth();
            selDate = getLocalDate();
            renderCal(); renderList(selDate);
            updatePartSuggestions();
        };

        function renderCal() {
            document.getElementById('currentMonthStr').innerText = `${curYear}년 ${curMonth+1}월`;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '<div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>';
            const first = new Date(curYear, curMonth, 1).getDay();
            const last = new Date(curYear, curMonth+1, 0).getDate();
            const todayStr = getLocalDate();
            for(let i=0; i<first; i++) grid.innerHTML += '<div></div>';
            for(let d=1; d<=last; d++) {
                const ymd = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const cnt = logs.filter(l => l.date === ymd).length;
                const isToday = (ymd === todayStr) ? 'today' : '';
                const isSelected = (ymd === selDate) ? 'selected' : '';
                grid.innerHTML += `<div class="day-cell ${isToday} ${isSelected}" onclick="selectDate('${ymd}')"><b>${d}</b><div class="badge ${cnt > 0 ? 'show' : ''}">${cnt}</div></div>`;
            }
        }

        function selectDate(ymd) { selDate = ymd; renderCal(); renderList(ymd); }
        function goTab(tab) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active-view'));
            if(tab==='calendar') { document.getElementById('viewCalendar').classList.add('active-view'); renderCal(); renderList(selDate); }
        }
        function openForm(id = null) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active-view'));
            document.getElementById('viewForm').classList.add('active-view');
            tempParts = [];
            if(id) { 
                const item = logs.find(l => l.id == id);
                document.getElementById('editId').value = item.id;
                document.getElementById('inDate').value = item.date;
                document.getElementById('inName').value = item.name;
                document.getElementById('inAction').value = item.action;
                document.getElementById('inLabor').value = item.labor || 0;
                tempParts = item.parts || [];
            } else { 
                document.getElementById('editId').value = '';
                document.getElementById('inDate').value = selDate;
                document.getElementById('inName').value = '';
                document.getElementById('inAction').value = '';
                document.getElementById('inLabor').value = '';
            }
            renderParts(); calcTotal();
        }
        function addPart() {
            const name = document.getElementById('partName').value;
            const buyPrice = Number(document.getElementById('partBuyPrice').value) || 0;
            const price = Number(document.getElementById('partPrice').value) || 0;
            const qty = Number(document.getElementById('partQty').value) || 1;
            if(!name || !price) return alert("부품명과 판매가를 입력하세요.");
            tempParts.push({ name, buyPrice, price, qty });
            document.getElementById('partName').value = ''; document.getElementById('partBuyPrice').value = ''; document.getElementById('partPrice').value = ''; document.getElementById('partQty').value = '';
            renderParts(); calcTotal();
        }
        function renderParts() {
            const l = document.getElementById('addedPartsList');
            l.innerHTML = '';
            tempParts.forEach((p, i) => {
                l.innerHTML += `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:5px 0;"><div>${p.name} (${p.qty}개)</div><div>${(p.price*p.qty).toLocaleString()}원</div></div>`;
            });
        }
        function calcTotal() {
            let labor = Number(document.getElementById('inLabor').value) || 0;
            let partsTotal = tempParts.reduce((sum, p) => sum + (p.price * p.qty), 0);
            let tot = labor + partsTotal;
            document.getElementById('displayTotal').innerText = tot.toLocaleString();
            return tot;
        }
        function saveData() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('inName').value;
            if(!name) return alert("업체명 입력 필수");
            const data = {
                id: id ? Number(id) : Date.now(),
                date: document.getElementById('inDate').value,
                name: name,
                action: document.getElementById('inAction').value,
                labor: Number(document.getElementById('inLabor').value),
                parts: tempParts, total: calcTotal()
            };
            if(id) { const idx = logs.findIndex(l => l.id == id); logs[idx] = data; } else { logs.push(data); }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
            updatePartSuggestions();

            if (GOOGLE_SHEET_URL !== "여기에_스크립트_URL을_넣으세요") {
                fetch(GOOGLE_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
                .then(() => { alert("저장 완료"); goTab('calendar'); })
                .catch(() => { alert("저장 완료 (동기화 실패)"); goTab('calendar'); });
            } else { alert("저장 완료"); goTab('calendar'); }
        }
        function updatePartSuggestions() {
            const datalist = document.getElementById('partSuggestions');
            const partNames = new Set();
            logs.forEach(log => { if (log.parts) log.parts.forEach(p => partNames.add(p.name)); });
            datalist.innerHTML = Array.from(partNames).map(name => `<option value="${name}">`).join('');
        }
        function renderList(ymd) {
            const list = document.getElementById('dailyList');
            list.innerHTML = '';
            const tgts = logs.filter(l => l.date === ymd);
            if(tgts.length === 0) { list.innerHTML = '<div style="color:#aaa;padding:20px;text-align:center;">기록 없음</div>'; return; }
            tgts.forEach(item => {
                const d = document.createElement('div');
                d.className = 'card'; d.onclick = () => openForm(item.id);
                d.innerHTML = `<div><span>${item.name}</span> <span style="color:#0056b3;font-weight:bold;">￦${Number(item.total).toLocaleString()}</span></div><div style="color:#666;font-size:0.9rem;">${item.action.substring(0,30)}</div>`;
                list.appendChild(d);
            });
        }
        function changeMonth(d) { curMonth += d; if(curMonth<0){curMonth=11; curYear--;} if(curMonth>11){curMonth=0; curYear++;} renderCal(); }
    </script>
</body>
</html>
